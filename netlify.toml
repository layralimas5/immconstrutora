# Deploy do site da IMM na Netlify.
#
# As variáveis de medição (VITE_GA4_ID, VITE_ADS_ID e labels) NÃO ficam aqui:
# elas entram em Site configuration > Environment variables, no painel da
# Netlify. Como o Vite injeta essas variáveis no bundle durante o build, é
# preciso disparar um novo deploy depois de cadastrá-las. Ver docs/medicao.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Assets com hash no nome podem ser cacheados para sempre: quando o conteúdo
# muda, o nome do arquivo muda junto.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens mantêm o mesmo nome entre deploys, então o cache precisa revalidar,
# senão trocar uma foto não aparece para quem já visitou o site.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
